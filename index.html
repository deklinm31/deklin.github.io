<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deklin Murphy — Collection</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 28px 40px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }

        header a {
            color: #fff;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 1.5px;
            font-weight: 400;
        }

        .collection {
            justify-self: start;
        }

        .logo {
            justify-self: center;
            font-size: 15px;
            letter-spacing: 2px;
            font-weight: 500;
        }

        .connect {
            justify-self: end;
        }

        .collection-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 20px 40px 40px;
        }

        .project {
            display: block;
            position: relative;
            overflow: hidden;
            background: #111;
            aspect-ratio: 4 / 3;
        }

        .project img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        .project:hover img {
            transform: scale(1.03);
            opacity: 0.75;
        }

        @media (max-width: 700px) {

            header {
                padding: 24px 20px;
            }

            header a {
                font-size: 10px;
                letter-spacing: 1px;
            }

            .logo {
                font-size: 12px;
            }

            .collection-grid {
                grid-template-columns: 1fr;
                gap: 12px;
                padding: 10px 20px 20px;
            }
        }
    </style>
</head>

<body>

    <header>

        <a href="index.html" class="collection">
            COLLECTION
        </a>

        <div class="logo">
            DEKLIN MURPHY
        </div>

        <a href="#" class="connect">
            CONNECT
        </a>

    </header>

    <main class="collection-grid">

        <!-- TOP LEFT — MERKII -->
        <a href="#" class="project">
            <img src="splitmerkii.png" alt="MERKII">
        </a>

        <!-- TOP RIGHT — MIXED INTENTIONS -->
        <a href="#" class="project">
            <img src="mixedintentionsvn.png" alt="Mixed Intentions">
        </a>

        <!-- BOTTOM LEFT — DIGITAL SUSTAINABILITY -->
        <a href="#" class="project">
            <img src="DigitalSustainability_Advertisement.jpg" alt="Digital Sustainability">
        </a>

        <!-- BOTTOM RIGHT — FRATERNITY DIGITAL DRAWING -->
        <a href="#" class="project">
            <img src="Fraternity_DigitalDrawing.jpg" alt="Fraternity Digital Drawing">
        </a>

    </main>

</body>
</html>
